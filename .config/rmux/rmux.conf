# ==============================================================================
# RMUX Configuration (rmux.conf)
# Compatible with tmux while optimized for Antigravity (agy) & Claude Code
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Core Multiplexer Settings (from .tmux.conf)
# ------------------------------------------------------------------------------
set -g mouse on

# 1-based indexing for windows and panes (maps naturally to keyboard layout)
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Window & terminal titles
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S:#I:#W - \"#T\""

# ------------------------------------------------------------------------------
# 2. Clipboard Integration
# ------------------------------------------------------------------------------
# Native OSC 52 terminal clipboard (Alacritty / modern terminals)
set -s set-clipboard on

# X11 / xclip clipboard integration (from .tmux.conf)
bind C-c run "rmux save-buffer - | xclip -i -sel clipboard"
bind C-v run "rmux set-buffer \"$(xclip -o -sel clipboard)\"; rmux paste-buffer"

# ------------------------------------------------------------------------------
# 3. AI Agent Optimizations (Antigravity 'agy' & Claude Code)
# ------------------------------------------------------------------------------
# Large scrollback buffer for long tool runs, logs, code diffs, and reviews
set -g history-limit 50000

# Zero escape delay (eliminates ESC latency in Vim/Neovim, TUIs, and agent prompts)
set -s escape-time 0

# Terminal focus events (essential for Neovim and agent pane tracking)
set -g focus-events on

# Terminal passthrough (supports image protocols, Kitty graphics, and terminal queries)
set -g allow-passthrough on

# Responsive window sizing (prevents headless or background teammate panes from shrinking the window)
setw -g aggressive-resize on
set -g window-size latest

# Truecolor (24-bit RGB) support for rich markdown, diffs, and syntax highlighting
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"

# Pass through environment variables to agent sessions and teammate panes
set -ga update-environment " ANTHROPIC_API_KEY GEMINI_API_KEY CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS AGY_PROJECT AGY_AGENT AGY_EFFORT"

# ------------------------------------------------------------------------------
# 4. Navigation & Workspace Workflow
# ------------------------------------------------------------------------------
# Retain current working directory when opening new windows and splits
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Toggle pane title bar (helpful when tracking multi-pane agent runs)
bind T set -g pane-border-status

# ------------------------------------------------------------------------------
# 5. Quick AI Agent Popups (Floating Overlays)
# ------------------------------------------------------------------------------
# Prefix + C-a: Launch Antigravity CLI (agy) in a floating popup overlay
bind C-a display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "agy"

# Prefix + C-k: Launch Claude Code (via rmux claude) in a floating popup
bind C-k display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "rmux claude"

# Prefix + C-t: Quick scratch terminal popup
bind C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "$SHELL"

# ------------------------------------------------------------------------------
# 6. Notifications & Attention Alerts (Desktop & Status Bar)
# ------------------------------------------------------------------------------
# Monitor bells across all windows
set -g bell-action any
setw -g monitor-bell on

# Forward bell to terminal so Alacritty / desktop environment can flash urgency
set -g visual-bell off

# Desktop notification on bell (fired when Claude Code, agy, or scripts emit \a for input or completion)
set-hook -g alert-bell 'run-shell -b "command -v notify-send >/dev/null 2>&1 && notify-send -i dialog-information -a RMUX \"RMUX: Input Needed\" \"[#S:#I] #W - Attention requested\""'

# Desktop notification on silence (fired when a monitored long-running process finishes output)
set-hook -g alert-silence 'run-shell -b "command -v notify-send >/dev/null 2>&1 && notify-send -i dialog-information -a RMUX \"RMUX: Command Finished\" \"[#S:#I] #W - Silence detected\""'

# Shortcuts to toggle activity / silence monitoring on the active window:
# Prefix + M-m: Toggle activity monitoring (alerts when new output appears)
bind M-m setw monitor-activity \; display-message "Activity monitoring: #{?monitor-activity,ON,OFF}"
# Prefix + M-s: Prompt for silence threshold in seconds (e.g. 5 = alert after 5s silence; 0 to disable)
bind M-s command-prompt -p "Monitor silence after seconds (0 to disable):" "setw monitor-silence %%"

# ------------------------------------------------------------------------------
# 7. Nord Theme Styling (matches Alacritty & GTK themes)
# ------------------------------------------------------------------------------
# Status bar layout
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#2e3440,fg=#d8dee9"

# Status left / right
set -g status-left-length 40
set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold] #S #[fg=#88c0d0,bg=#2e3440,nobold] "
set -g status-right-length 80
set -g status-right "#[fg=#4c566a,bg=#2e3440]#[fg=#e5e9f0,bg=#3b4252] %Y-%m-%d #[fg=#88c0d0,bg=#434c5e,bold] %H:%M #[fg=#2e3440,bg=#88c0d0,bold] #h "

# Window tabs (includes [!] alert tag on bell, [*] on activity)
setw -g window-status-format "#[fg=#d8dee9,bg=#2e3440] #I:#W#{?window_bell_flag, #[fg=#bf616a]![default],}#{?window_activity_flag, #[fg=#ebcb8b]*[default],} "
setw -g window-status-current-format "#[fg=#eceff4,bg=#434c5e,bold] #I:#W#{?window_bell_flag, #[fg=#bf616a]![default],} #[fg=#434c5e,bg=#2e3440,nobold]"

# Alert styles: Nord Aurora Red for Bell / Input Needed, Aurora Yellow for Activity
setw -g window-status-bell-style "fg=#eceff4,bg=#bf616a,bold"
setw -g window-status-activity-style "fg=#2e3440,bg=#ebcb8b,bold"

# Pane borders (Nord Cyan highlight for active pane)
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"
set -g pane-border-format " #{pane_index}: #{pane_title} "

# Message & command line styling
set -g message-style "bg=#434c5e,fg=#eceff4"
set -g message-command-style "bg=#434c5e,fg=#eceff4"

# ------------------------------------------------------------------------------
# 8. TPM Plugin Manager Integration (compatible with .tmux.conf)
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin "nordtheme/tmux"

# Initialize TMUX/RMUX plugin manager if installed
if-shell "[ -f ~/.tmux/plugins/tpm/tpm ]" "run '~/.tmux/plugins/tpm/tpm'"
